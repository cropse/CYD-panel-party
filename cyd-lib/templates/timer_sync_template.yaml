# timer_sync_template.yaml
# Icon + label sync for HA timer entities.
# Two text_sensors: state (idle/active/paused) drives icon+widget;
# finishes_at is only used for countdown math — it silently drops on idle/paused
# because HA removes the attribute key (esphome/issues#5742, esphome#13239).
substitutions:
  ts_id: ""
  ha_entity: ""
  btn_id: ""
  default_label: ""
  ico_on: ""
  ico_off: ""
  ico_alert: "\\U000F0026"

text_sensor:
  # PRIMARY: timer state — always fires on idle/active/paused transitions.
  - platform: homeassistant
    id: ${ts_id}_state
    entity_id: ${ha_entity}
    on_value:
      then:
        - lvgl.widget.update:
            id: ${btn_id}
            state:
              checked: !lambda 'return x == "active";'
              disabled: !lambda 'return x == "unavailable" || x == "unknown";'
        - lvgl.label.update:
            id: lbl_${btn_id}
            text: !lambda |-
              if (x == "unavailable" || x == "unknown") {
                return "${ico_alert}";
              }
              if (x == "active") {
                return "${ico_on}";
              }
              return "${ico_off}";
        - lvgl.label.update:
            id: lbl_text_${btn_id}
            text: !lambda |-
              if (x == "active") {
                return "Active";
              }
              return "${default_label}";

  # SECONDARY: finishes_at — only present while active. Do NOT use for icon logic;
  # HA drops the attribute key on idle/paused and ESPHome never sees the update.
  - platform: homeassistant
    id: ${ts_id}_finish
    entity_id: ${ha_entity}
    attribute: finishes_at

interval:
  - interval: 1s
    then:
      - lvgl.widget.update:
          id: ${btn_id}
          state:
            checked: !lambda 'auto s = id(${ts_id}_state).state; return s == "active";'
            disabled: !lambda 'auto s = id(${ts_id}_state).state; return s == "unavailable" || s == "unknown";'
      - lvgl.label.update:
          id: lbl_${btn_id}
          text: !lambda |-
            auto s = id(${ts_id}_state).state;
            if (s == "unavailable" || s == "unknown") {
              return "${ico_alert}";
            }
            if (s == "active") {
              return "${ico_on}";
            }
            return "${ico_off}";
      - lvgl.label.update:
          id: lbl_text_${btn_id}
          text: !lambda |-
            auto s = id(${ts_id}_state).state;
            if (s != "active") {
              return "${default_label}";
            }
            auto ts = id(${ts_id}_finish).state;
            if (ts == "unknown" || ts == "unavailable" || ts == "") {
              return "${default_label}";
            }

            // Parse ISO 8601 timestamp (e.g., 2024-05-24T12:00:00+00:00)
            int year, month, day, hour, minute, second;
            if (sscanf(ts.c_str(), "%d-%d-%dT%d:%d:%d", &year, &month, &day, &hour, &minute, &second) != 6) {
              return "${default_label}";
            }

            struct tm target_tm = {0};
            target_tm.tm_year = year - 1900;
            target_tm.tm_mon = month - 1;
            target_tm.tm_mday = day;
            target_tm.tm_hour = hour;
            target_tm.tm_min = minute;
            target_tm.tm_sec = second;

            // Note: mktime uses local time, but HA provides UTC.
            // For simple countdown, as long as 'now' is also UTC, it works.
            time_t target_time = mktime(&target_tm);
            time_t now = id(esptime).now().timestamp;

            int diff = (int)difftime(target_time, now);

            if (diff <= 0) {
              return "${default_label}";
            }

            int h = diff / 3600;
            int m = (diff % 3600) / 60;
            int secs = diff % 60;

            char buf[16];
            if (h > 0) {
              sprintf(buf, "%d:%02d:%02d", h, m, secs);
            } else {
              sprintf(buf, "%02d:%02d", m, secs);
            }
            return buf;